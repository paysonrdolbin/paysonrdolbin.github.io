<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payson Dolbin</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0f14;
      --fg: #e6edf3;
      --accent: #58a6ff;
      --muted: #8b949e;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --accent: #0969da;
        --muted: #57606a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 32rem;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Payson Dolbin</h1>
    <p>This site is under construction. Check back soon.</p>
    <div class="links">
      <a href="https://github.com/paysonrdolbin">GitHub</a>
    </div>
  </main>
</body>
</html>
